description: >-
  AppOmni publishes no pricing. Every page in https://appomni.com/page-sitemap.xml was enumerated on
  2026-09-04 and there is no pricing, plans or packaging page; https://appomni.com/pricing/ returns 404.
  The only route to access is a sales conversation via https://appomni.com/demo-request/. The API is
  not sold separately — it is included with an AppOmni tenant, and the API token is created inside the
  platform under Settings > API Settings. This replaces a scaffold written by a 2026-05-04 bulk sweep
  that invented Free / Professional / Enterprise tiers with per-minute and per-month quotas AppOmni has
  never published.
