aid: appomni
name: AppOmni
description: AppOmni is a SaaS and AI security platform (SSPM) that gives security teams continuous visibility into
  the posture, identities, third-party connections and data exposure of the SaaS applications that run an enterprise
  — Salesforce, Microsoft 365, Google Workspace, Slack, ServiceNow, Okta, Workday, GitHub, Box, Zoom and custom
  applications built on its Developer Platform. It publishes a tenant-scoped REST API covering posture findings,
  policies, compliance reporting, monitored services, identity, discovery, insights, SCIM 2.0 provisioning and AI
  security, plus AskOmni (an MCP server) and AgentGuard runtime prompt protection for agentic AI.
type: Index
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Commercial SaaS — tenant-hosted API on the customer's own AppOmni subdomain
  confidence: high
