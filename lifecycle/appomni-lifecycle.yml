sla:
  url: https://appomni.com/service-level-agreement/
  status: 200
  published: true
  summary: >-
    AppOmni publishes a customer-facing Service Level Agreement defining System Availability
    (excluding Scheduled Maintenance and Emergency Maintenance), severity tiers (Critical Business
    Impact, Serious Business Impact), support Business Hours (currently 9:00am-6:00pm US Pacific,
    Monday-Friday excluding US federal holidays) and named Scheduled Maintenance Windows.
  maintenance_windows:
    - region: North and South America
      window: Thursday 18:00-20:00 and Friday 18:00 through Monday 05:00 US Pacific
    - region: EMEA and APAC
      window: Friday 10:00 through Sunday 13:00 US Pacific
  emergency_maintenance: >-
    AppOmni commits to contacting the customer with expected start time, planned duration and expected
    availability impact before applying urgent patches outside the Scheduled Maintenance Window.
