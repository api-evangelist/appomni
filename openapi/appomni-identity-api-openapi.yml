  /api/v1/identity/user/:
    get:
      operationId: listServiceUsers
      summary: List Service Users
      tags:
      - Identity
      description: 'Returns a paginated list of service users.


        Filter Fields


        Specified as query string parameters.


        Parameter

        Type

        Description

        Example


        id

        String

        Filter by monitored service user record ID.

        0f55fd46-6f0e-48c0-a0a1-8a615c8d5f1a


        identity_id

        String

        Filter by associated unified identity ID.

        4e5ab37b-7d39-4fa8-9f14-6f2e74d9cd1f


        last_login__gte

        String (ISO 8601)

        Filter users whose last login is on or after the supplied timestamp.

        2024-09-01T00:00:00Z


        last_login__lte

        String (ISO 8601)

        Filter users whose last login is on or before the supplied timestamp.

        2024-09-30T23:59:59Z


        limit

        Integer

        Maximum number of records to return per page.

        25


        name

        String

        Filter by full name.

        Jane Doe


        offset

        Integer

        Number of records to skip before returning results.

        0


        ordering

        String

        Sort field list. Prefix a field with - for descending order.

        username,-last_login


        permission_level__in

        Array[String]

        Filter by one or more permission levels. Supported values: admin , elevated , standard , not_applicable .

        ["admin","elevated"]


        search

        String

        Free-text search across indexed user fields. Must be 3 to 256 characters.

        Jane


        service_id

        Integer

        Filter by monitored service ID.

        101


        service_org_id__in

        Array[Integer]

        Filter by one or more monitored service IDs.

        [101,202,303]


        service_org_name

        String

        Filter by monitored service name.

        GitHub


        service_type__in

        Array[String]

        Filter by one or more monitored service type slugs.

        ["github","slack"]


        user_id

        String

        Filter by service-native user ID.

        external-user-123


        user_status__in

        Array[String]

        Filter by one or more user statuses. Supported values: active , inactive , disabled , deprovisioned , unknown .

        ["active","inactive"]


        username

        String

        Filter by username.

        jane.doe


        Sort Fields


        Use these public field names in ordering :


        Field

        Example


        identity_id

        ordering=identity_id


        last_login

        ordering=-last_login


        name

        ordering=name


        permission_level

        ordering=-permission_level


        service_org_name

        ordering=service_org_name


        service_type

        ordering=-service_type


        user_status

        ordering=user_status


        username

        ordering=username


        Examples:


        - ordering=username


        - ordering=-last_login


        - ordering=service_org_name,username


        Response Fields


        Paged response wrapper:


        Field

        Type

        Description

        Example


        count

        Integer

        Total number of matching records.

        1


        results

        Array[Object]

        List of user records for the current page.

        [...]


        Service user schema:


        Field

        Type

        Description

        Example


        active

        Boolean

        Whether the record is marked active.

        true


        created_at_date

        String (ISO 8601)

        Timestamp when the user record was created.

        2024-01-15T12:00:00Z


        email

        String or null

        Email address for the monitored service user.

        jane@example.com


        has_elevated_perms

        Boolean

        Whether the user has elevated permissions.

        false


        has_admin_perms

        Boolean or null

        Whether the user has admin permissions.

        false


        id

        String

        Unique monitored service user record ID.

        0f55fd46-6f0e-48c0-a0a1-8a615c8d5f1a


        is_internal_user

        Boolean

        Whether the user is an internal user.

        false


        last_login

        String (ISO 8601) or null

        Most recent login time for the user.

        2024-07-08T10:30:00Z


        modified_at_date

        String (ISO 8601) or null

        Timestamp when the user record was last modified.

        2024-07-08T10:35:00Z


        name

        String or null

        Full name for the monitored service user.

        Jane Doe


        permission_level

        String

        Effective permission level.

        standard


        primary_rbac_element_name

        String or null

        Primary RBAC element name for the user.

        viewer


        service_org_id

        Integer

        Monitored service ID.

        101


        service_org_name

        String

        Human-readable monitored service name.

        GitHub


        service_type

        String

        Service type value.

        github


        service_type_slug

        String

        Normalized service type slug.

        github


        unified_identity_id

        Str'
