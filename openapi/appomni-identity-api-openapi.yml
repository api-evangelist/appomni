  /oauth/token/:
    post:
      operationId: exchangeRefreshTokenForNewAccessToken
      summary: Exchange refresh token for new access token
      tags:
      - Authorization Tokens
      description: "This is a standard OAuth 2.0 \"Refresh Token Grant\" flow that enables the exchange\
        \ of a valid Refresh Token for a new Access Token. The valid Access Token can then be used to\
        \ make authenticated API requests in the context of the user who granted the Refresh Token.\n\n\
        \ Request Body\n\n Field \n Data Type \n Required \n Description \n Example \n\n grant_type \n\
        \ String \n Yes \n OAuth2 grant type (must be \"refresh_token\") \n refresh_token \n\n refresh_token\
        \ \n String \n Yes \n Your Refresh Token \n {{refreshtoken}} \n\n client_id \n String \n Yes \n\
        \ The Client ID of your AppOmni API Application \n {{api_app_client_id}} \n\n client_secret \n\
        \ String \n Yes \n The Client Secret of your AppOmni API Application \n {{api_app_client_secret}}\
        \ \n\n Response Fields\n\n Field \n Data Type \n Description \n Example \n\n access_token \n String\
        \ \n API access token \n XXXXX \n\n expires_in \n Integer \n Token expiration time in seconds\
        \ \n 3600 \n\n token_type \n String \n Type of authentication token \n Bearer \n\n scope \n String\
        \ \n Permissions granted to the token \n\n refresh_token \n String \n Token to refresh access\
        \ token \n XXXXX"
      responses:
        '200':
          description: Exchange Refresh Token for New Access Token
          content:
            application/json:
              schema:
                type: object
              examples:
                ExchangeRefreshTokenforNewAccessToken:
                  summary: Exchange Refresh Token for New Access Token
                  value:
                    access_token: XXXXX
                    expires_in: 3600
                    token_type: Bearer
                    scope: ''
                    refresh_token: XXXXX
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/core/oauthaccesstoken/manual/:
    post:
      operationId: manuallyGrantAccessTokenWithSpecificExpirationDate
      summary: Manually Grant Access Token with Specific Expiration Date
      tags:
      - Authorization Tokens
      description: "Use this route to grant an Access Token with a custom expiration date. This can be\
        \ used to create long-lived API tokens where necessary for service-to-service integrations that\
        \ cannot execute the OAuth 2.0 token grant flow using a Refresh Token.\n\n When using this capability,\
        \ a new Refresh Token will be created for the specified Application. An Access Token with the\
        \ specified expiration date will be granted under that Refresh Token.\n\n In the request, application\
        \ is the ID of the AppOmni API Application to grant the token under. The API token you are using\
        \ to make this request must have access to the application.\n\n You can execute a GET request\
        \ on /api/v1/core/oauthapplication/?limit=25&offset=0&ordering=-name to obtain ID's for available\
        \ API applications.\n\n Request Body\n\n Field \n Data Type \n Required \n Description \n Example\
        \ \n\n application \n Integer \n Yes \n Application \n 11472 \n\n description \n String \n Yes\
        \ \n Description of the resource \n Example Description. Setting to expire on 05/31... \n\n access_token_expiration\
        \ \n String (ISO datetime) \n Yes \n Access token expiration \n 2025-05-31T07:00:00.000Z \n\n\
        \ Response Fields\n\n Field \n Data Type \n Description \n Example \n\n application \n Integer\
        \ \n Application \n 11472 \n\n access_token_expiration \n String (ISO datetime) \n Access token\
        \ expiration \n 2025-05-31T07:00:00Z \n\n access_token \n String \n API access token \n XXXXX\
        \ \n\n refresh_token \n String \n Token to refresh access token \n XXXXX \n\n description \n String\
        \ \n Description of the resource \n Example Description. Setting to expire on 05/31..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              application: 11472
              description: Example Description. Setting to expire on 05/31/2025
              access_token_expiration: '2025-05-31T07:00:00.000Z'
      responses:
        '200':
          description: Example of manual token grant
          content:
            application/json:
              schema:
                type: object
              examples:
                Exampleofmanualtokengrant:
                  summary: Example of manual token grant
                  value:
                    application: 11472
                    access_token_expiration: '2025-05-31T07:00:00Z'
                    access_token: XXXXX
                    refresh_token: XXXXX
                    description: Example Description. Setting to expire on 05/31/2025
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /oauth/introspect/:
    get:
      operationId: introspectAccessToken
      summary: Introspect Access Token
      tags:
      - Authorization Tokens
      description: "This is a RFC 7662-compliant Access Token Introspection endpoint. When making a query\
        \ to the introspection endpoint with your valid access token in the Authorization header, you\
        \ will get a response including the Client ID of the API Application the Access Token belongs\
        \ to, the unix timestamp the token expires at, and the username of the user to which the token\
        \ grants access under.\n\n https://datatracker.ietf.org/doc/html/rfc7662#section-2.2"
      responses:
        '200':
          description: Introspect Access Token
          content:
            text/plain:
              schema:
                type: string
              example: "{\n    \"active\": true,\n    \"exp\": 1788793177,\n    \"client_id\": \"XXX\"\
                ,\n    \"username\": user123\"\n}"
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /oauth/revoke/:
    post:
      operationId: revokeRefreshToken
      summary: Revoke Refresh Token
      tags:
      - Authorization Tokens
      description: "This is a RFC 7009-compliant revocation route for OAuth Refresh Tokens granted under\
        \ AppOmni API Applications.\n\n This route should be called via POST with the token parameter\
        \ containing the value of the Refresh Token to be revoked. The token, and all Access Tokens granted\
        \ under it, will be immediately revoked.\n\n https://datatracker.ietf.org/doc/html/rfc7009#section-2.1"
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
