        \ title \n String \n No \n Job title of the user \n \"Manager\" \n\n is_active \n Boolean \n No\
        \ \n Enable/Disable user \n true \n\n groups \n Array[Integer] \n No \n List of IDs for roles\
        \ (groups) to which the user should be added. Roles are the RBAC assigned permissions. See GET\
        \ RBAC API endpoint (GET /core/group). \n [1392, 1394] \n\n environment_restricted \n Boolean\
        \ \n No \n Indicates whether environment restrictions are enabled for this user \n false \n\n\
        \ environments \n Array[Integer] \n No \n List of environment IDs to which the user should have\
        \ access. To get a list of environment IDs, GET LIST TAGS (GET /api/v1/core/tag/?type=environment)\
        \ \n [128781, 128777] \n\n Response Fields\n\n Field \n Data Type \n Description \n Example \n\
        \n id \n Integer \n unique identifier for the user \n 15050 \n\n username \n String \n username\
