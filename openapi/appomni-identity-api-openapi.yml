      summary: List Unified Identities
      tags:
      - Identity
      description: 'Returns a paginated list of unified identities.


        Filter Parameters


        Specified as query string parameters:


        Parameter

        Type

        Description

        Example


        any_admin

        Boolean

        Filter identities that have at least one linked admin user.

        true


        any_elevated

        Boolean

        Filter identities that have at least one linked elevated user.

        true


        created__gte

        String (ISO 8601)

        Filter identities created on or after the supplied timestamp.

        2024-01-01T00:00:00Z


        created__lte

        String (ISO 8601)

        Filter identities created on or before the supplied timestamp.

        2024-12-31T23:59:59Z


        email

        String

        Filter by primary email address.

        jane@example.com


        id

        String

        Filter by unified identity ID.

        4e5ab37b-7d39-4fa8-9f14-6f2e74d9cd1f


        last_login__gte

        String (ISO 8601)

        Filter identities whose last login is on or after the supplied timestamp.

        2024-09-01T00:00:00Z


        last_login__lte

        String (ISO 8601)

        Filter identities whose last login is on or before the supplied timestamp.

        2024-09-30T23:59:59Z


        limit

        Integer

        Maximum number of records to return per page.

        25


        modified__gte

        String (ISO 8601)

        Filter identities modified on or after the supplied timestamp.

        2024-07-01T00:00:00Z


        modified__lte

        String (ISO 8601)

        Filter identities modified on or before the supplied timestamp.

        2024-07-31T23:59:59Z


        name

        String

        Filter by display name.

        Jane Doe


        offset

        Integer

        Number of records to skip before returning results.

        0


        ordering

        String

        Sort field list. Prefix a field with - for descending order.

        -last_login,name


        permission_level__in

        Array[String]

        Filter by one or more permission levels. Supported values: admin , elevated , standard , not_applicable .

        ["admin","elevated"]


        search

        String

        Free-text search across indexed identity fields. Must be 3 to 256 characters.

        Jane


        services_linked__in

        Array[Integer]

        Filter by one or more linked monitored service IDs.

        [101,202,303]


        service_types__in

        Array[String]

        Filter by one or more linked monitored service type slugs.

        ["github","sfdc"]


        status__in

        Array[String]

        Filter by one or more identity statuses. Supported values: active , inactive , disabled , deprovisioned , unknown .

        ["active","inactive"]


