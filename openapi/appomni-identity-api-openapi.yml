  /api/v1/core/oauthapplication/:
    get:
      operationId: getAPIApplicationByClientID
      summary: Get API Application by Client ID
      tags:
      - Authorization Tokens
      description: Using this route you are able to query for an AppOmni API Application (OAuthApplication
        object) by Client ID. This will allow you to convert a Client ID to the API Application ID, which
        may be necessary for other operations (e.g. rotating the client secret via API).
      parameters:
      - name: client_id
        in: query
        required: false
        description: Query parameter client_id
        schema:
          type: string
        example: CLIENT_ID
      responses:
        '200':
          description: Get API Application by Client ID
          content:
            text/plain:
              schema:
                type: string
              example: "[\n    {\n        \"id\": 1,\n        \"created\": \"2025-09-07T14:59:37.872737Z\"\
                ,\n        \"modified\": \"2025-09-07T14:59:37.872717Z\",\n        \"external_id\": null,\n\
                \        \"created_by\": 1,\n        \"modified_by\": null,\n        \"owner\": 1,\n \
                \       \"name\": \"Sample Application\",\n        \"description\": null\n        \"client_id\"\
                : \"ABCDEF123456\",\n        \"redirect_uris\": \"\",\n        \"client_type\": \"confidential\"\
                ,\n        \"authorization_grant_type\": \"authorization-code\",\n        \"skip_authorization\"\
                : false,\n        \"allowed_scopes\": [],\n    }\n]"
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/core/oauthapplication/{app_id}/rotate_client_secret/:
    post:
      operationId: rotateAnAPIApplicationSClientSecret
      summary: Rotate an API Application's Client Secret
      tags:
      - Authorization Tokens
      description: "Making a POST request to this route with valid authorization credentials (must be\
        \ a valid API token with access to manage the API Application in question) will immediately rotate\
        \ the API Application's client secret. The new client secret will be required for all future Access\
        \ Token grant requests in conjunction with a valid Refresh Token.\n\n All existing Refresh Tokens\
        \ will remain valid, and all Access Tokens previously granted and still valid will remain so until\
        \ their expiration time.\n\n In most cases this action is only required if you believe your API\
        \ Application's Client Secret has been compromised. Otherwise, it is recommended you revoke and\
        \ issue new Refresh Tokens.\n\n Response Fields\n\n Field \n Data Type \n Description \n Example\
        \ \n\n client_secret \n String \n Client secret \n NEW_CLIENT_SECRET"
      parameters:
      - name: app_id
        in: path
        required: true
        description: Path parameter app_id
        schema:
          type: string
      responses:
        '200':
          description: Rotate an API Application's Client Secret
          content:
            application/json:
              schema:
                type: object
              examples:
                RotateanAPIApplicationsClientSecret:
                  summary: Rotate an API Application's Client Secret
                  value:
                    client_secret: NEW_CLIENT_SECRET
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'AppOmni API access token, created and managed in the AppOmni platform under Settings
        > API Settings. Sent as `Authorization: Bearer <token>`.'
  schemas:
    Error:
      type: object
      title: Error
      description: Standard Django REST Framework error envelope returned by the AppOmni API.
      properties:
        detail:
          type: string
          description: Human readable error message
