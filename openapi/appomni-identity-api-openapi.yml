        \ \n \"null\" \n\n is_active \n Boolean \n Enable/Disable user \n true \n\n locked \n Boolean\
        \ \n Account login disabled, either due to manual action or repeated failed login attempts \n\
        \ false \n\n locked_at \n Datetime \n Date/time account was locked. null if not applicable \n\
        \ null \n\n override_enable_direct_login \n Boolean \n When enabled, break glass access will allow\
        \ user to login with username and password bypassing default SSO login method \n false \n\n groups\
        \ \n Array[Integer] \n IDs for roles of which the user is a part \n [1392, 1394] \n\n created\
        \ \n Datetime \n creation timestamp \n \"2023-08-07T15:57:21.503302Z\" \n\n modified \n Datetime\
        \ \n modification timestamp \n \"2023-08-07T15:57:21.503322Z\" \n\n external_id \n String \n Reserved\
        \ for future use \n null \n\n timezone \n String \n Three letter time zone designation. Default\
        \ = \"UTC\" \n \"UTC\" \n\n mfa_enabled \n String \n Type of multi-factor authentication used.\
        \ Can be disabled, sms, totp \n \"disabled\" \n\n phone_verified \n Boolean \n User has verified\
        \ phone number for SMS (text message) MFA \n false \n\n is_mfa_verified \n Boolean \n User has\
