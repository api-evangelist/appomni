  /api/v1/core/auditlogs/action_types/:
    get:
      operationId: listAuditActionTypes
      summary: List audit action types
      tags:
      - Audit Logs
      description: 'Use this API route to programatically retrieve all possible Audit record action types, to use in filtering the Get Audit Logs endpoint if desired.


        This endpoint will return all possible Audit action types, which may include some action types not seen in your tenant.


        Response Fields


        Field

        Data Type

        Description

        Example


        action_type

        String

        The action type identifier used in audit logs

        policy_scan_ended


        description

        String

        Human-readable description of the action type

        Policy Scan Completed'
      responses:
        '200':
          description: List Audit Action Types
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              examples:
                ListAuditActionTypes:
                  summary: List Audit Action Types
                  value:
                  - action_type: ao_sys_setting_auth_change
                    description: AppOmni Auth Setting Change
                  - action_type: ao_sys_setting_change
                    description: AppOmni System Setting Change
                  - action_type: ao_scim_setting_change
                    description: AppOmni SCIM Mapping Change
                  - action_type: ao_oidc_setting_change
                    description: AppOmni OIDC Setting Change
                  - action_type: ao_idp_attribute_mapping_created
                    description: AppOmni IdP Attribute Mapping Created
                  - action_type: ao_idp_attribute_mapping_updated
                    description: AppOmni IdP Attribute Mapping Updated
                  - action_type: ao_idp_attribute_mapping_deleted
                    description: AppOmni IdP Attribute Mapping Deleted
                  - action_type: asmt_started_role
                    description: Role (Data Access) Assessment Started
                  - action_type: asmt_started_ms
                    description: Service Assessment Started
                  - action_type: asmt_ended_role
                    description: Role (Data Access) Assessment Completed
                  - action_type: asmt_ended_ms
                    description: Service Assessment Completed
                  - action_type: policy_scan_requested
                    description: Policy Scan Requested
                  - action_type: policy_scan_started
                    description: Policy Scan Started
                  - action_type: policy_scan_ended
                    description: Policy Scan Completed
                  - action_type: policy_disabled
                    description: Policy Disabled
                  - action_type: policy_enabled
                    description: Policy Enabled
                  - action_type: policy_created
                    description: Policy Created
                  - action_type: policy_deleted
                    description: Policy Deleted
                  - action_type: rule_created
                    description: Rule Created
                  - action_type: rule_deleted
                    description: Rule Deleted
                  - action_type: rule_modified
                    description: Rule Modified
                  - action_type: exception_created
                    description: Policy Rule Exception Created
                  - action_type: exception_deleted
                    description: Policy Rule Exception Deleted
                  - action_type: ms_created
                    description: Monitored Service Added
                  - action_type: ms_deleted
                    description: Monitored Service Removed
                  - action_type: ms_auth_failed
