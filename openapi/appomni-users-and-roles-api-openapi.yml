        " user5@example.com "


        first_name

        String

        No

        First name of the user

        "Sarah"


        last_name

        String

        No

        Last name of the user

        "Wilson"


        phone

        String

        No

        Phone number for the user

        "+1-555-0123"


        title

        String

        No

        Job title of the user

        "Manager"


        is_active

        Boolean

        No

