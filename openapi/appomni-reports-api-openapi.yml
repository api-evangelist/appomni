        The name of the app the report being requested is defined in

        core


        report_pretty_name

        String

        Human-readable name

        All Issues Export Report


        report_description

        String

        Detailed report description

        Report on all issues


        report_class

        String

        The name of the actual class in code defining this report. Used as a unique identifier for the report

        AllIssuesExportReport


        report_types

        Array[String]

        Possible output file types which can be specified when generating the report

        ["xlsx", "csv", "json"]


        service_type

        String

        Service type

        core


        accepted_parameters

        Array[Object]

