  /api/v1/reports/request/report:
    get:
      operationId: generateASingleReport
      summary: Generate a single report
      tags:
      - Reports
      description: 'Creates a request to generate a single report, which will be created as the desired file type. This will be queued up and processed by at a later time; most likely immediately.)


        - In addition to the required parameters ( report_package , report_type , report_class , and in most cases, monitored_service_id ), additional parameters may be provided as required by the individual report. Parameters that are not needed by the individual report will be ignored.


        - report_class and report_package , along with the supported file types, and any required additional parameters, can be found from the List Available Reports endpoint.


        - POST operation is available:


        - Certain reports contain data in the params, such as long lists of GUIDs, that cause length issues with the URLs if that data is encoded into the URL as a query string.


        - AppOmni accepts POST as an alternative, where the data is instead sent via the body of the request.


        Response Fields


        Field

        Data Type

        Description

        Example


        request_id

        String (UUID)

        Unique identifier for the request

        5071137b-1e9a-4697-bb0c-c28128b7cbc8


        report_status

        String

        Status of the report

        requested


        pending_report_id

        Integer

        ID of the pending report

        8'
      parameters:
      - name: report_type
        in: query
        required: false
        description: Query parameter report_type
        schema:
          type: string
        example: xlsx
      responses:
        '202':
          description: Generate Single XLSX Report
          content:
            application/json:
              schema:
                type: object
              examples:
                GenerateSingleXLSXReport:
                  summary: Generate Single XLSX Report
                  value:
                    request_id: 5071137b-1e9a-4697-bb0c-c28128b7cbc8
                    report_status: requested
                    pending_report_id: 8
                GenerateSingleCSVReport:
                  summary: Generate Single CSV Report
                  value:
                    request_id: 5071137b-1e9a-4697-bb0c-c28128b7cbc8
                    report_status: requested
                    pending_report_id: 8
                GenerateSingleJSONReport:
                  summary: Generate Single JSON Report
                  value:
                    request_id: 5071137b-1e9a-4697-bb0c-c28128b7cbc8
                    report_status: requested
                    pending_report_id: 8
                GenerateSingleReportwithacceptedparameters:
                  summary: Generate Single Report with accepted parameters
                  value:
                    request_id: 5071137b-1e9a-4697-bb0c-c28128b7cbc8
                    report_status: requested
                    pending_report_id: 8
        '200':
          description: Generate Single Report
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: generateASingleReport2
      summary: Generate a single report
      tags:
      - Reports
      description: 'Creates a request to generate a single report using POST method. This is useful when report parameters contain long lists that would exceed URL length limits.


