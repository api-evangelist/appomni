      tags:
      - Reports
      description: "Requests that a report group be run.\n\n The returned request_id is used to check\
        \ the status of the request later.\n\n Response Fields Documentation\n\n Field \n Data Type \n\
        \ Description \n Example \n\n request_id \n String (UUID) \n Unique identifier for the request\
