security:
- bearerAuth: []
tags:
- name: ValueList
  description: 'ValueList and ValueListElement are used to manage lists of items used by Insights. ValueLists have a type designation and will be used by Insights on convention based on their type.


    Overview


    - ValueList : A container for a list of values with a specific type and usage


    - ValueListElement : Individual items within a ValueList'
