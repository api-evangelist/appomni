  /api/v1/core/policy/snapshot/:
    post:
      operationId: createAPosturePolicySnapshot
      summary: Create a Posture Policy Snapshot
      tags:
      - Policies
      description: "STEPS:\n\n- GET - List Monitored Services [your_subdomain]/api/v1/core/monitoredservice/\
        \ \n\n- GET - List monitored service policy settings - M365 only [your_subdomain]/api/v1/o365/svcexp/:serviceId/policy\
        \ \n\n- POST - Create a Posture Policy Collections Snapshot [your_subdomain]/api/v1/core/policy/snapshot\
        \ \n\n * `“name”` - The name you are giving the snapshot that is being created\n* `”baseline_monitored_service”`\
        \ - maps to `”id”` from List Monitored Services - The monitored service that has the base policy\
        \ content that is being snapshotted. \n* \"target_monitored_services\" - maps to `”id”` from List\
        \ Monitored Services - The monitored services that the snapshot is saved to.\n* `”description”`\
        \ - string - *optional\n* `“tags”` - maps to `“tags”` from List Monitored Services expressed as\
        \ integers (environment or target tags) - *optional\n* `“policy_category”` - maps to `“policy_category”`\
        \ from List monitored service policy settings -M365 only\n* `“policy_id”` - maps to `“policy_id”`\
        \ from List monitored service policy settings \n\n PAYLOAD (BODY)\n\n {\n “type”: “policies”\n\
        \ “collections”: [\n {\n “name”: “<string>”,\n “description”: “<string>”,\n “baseline_monitored_service_id”:\
        \ “<monitored service ID>”,\n “target_monitored_service_ids”: “<related monitored service IDs>”,\n\
        \ “policy_category”: “<string>”,\n “policy_id”: “<policy ID>”,\n “tags”: “<related tag IDs>”,\n\
        \ }\n ] \n }\n\n Request Parameters\n\n Field \n Data Type \n Required \n Description \n Example\
        \ \n\n type \n String \n Yes \n Type \n policies \n\n collections \n Array[Object] \n Yes \n List\
        \ of collections \n [{\"name\": \"appomni\", \"description\": \"... \n\n collections[].name \n\
        \ String \n Yes \n Name of the resource \n appomni \n\n collections[].description \n String (UUID)\
        \ \n Yes \n Description of the resource \n 74691f58-52a4-453e-9c22-b88c0e2cc851 \n\n collections[].baseline_monitored_service\
        \ \n Integer \n Yes \n Collections[] baseline monitored service \n 17690 \n\n collections[].target_monitored_services\
        \ \n Array[Integer] \n Yes \n List of collections[].target monitored services \n [17690] \n\n\
        \ collections[].policy_category \n String \n Yes \n Collections[] policy category \n m365exchangeaccepteddomain\
        \ \n\n collections[].policy_id \n String (UUID) \n Yes \n ID of the collections[].policy \n 4f07749c-6a46-492f-96fc-aa597238281b"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              type: policies
              collections:
              - name: appomni
                description: 74691f58-52a4-453e-9c22-b88c0e2cc851
                baseline_monitored_service: 17690
                target_monitored_services:
                - 17690
                policy_category: m365exchangeaccepteddomain
                policy_id: 4f07749c-6a46-492f-96fc-aa597238281b
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/core/monitoredservice/score/policycomponents/{policy_id}/:
    get:
      operationId: getPolicyStats
      summary: Get policy stats
      tags:
      - '[Beta] Policy Assessment Stats'
      description: "BETA - The policy_stats endpoint retrieves policy assessment statistics for a specified\
        \ policy ID.\n\n This endpoint only works for posture policies. It will return a 404 for functional\
        \ and data security policies.\n\n The stats are not realtime; they are based on the last recalculation,\
        \ which happens once per day.\n\n Response Fields\n\n Field \n Data Type \n Description \n Example\
        \ \n\n id \n String \n The ID of the monitored service \n \"93\" \n\n name \n String \n The name\
        \ of the monitored service \n \"O365 - Prod\" \n\n stats \n Object \n A dictionary containing\
        \ stats for risk levels \n See nested fields below \n\n stats.critical \n Object \n Stats for\
        \ critical risk level \n See nested fields below \n\n stats.critical.count_passing \n Integer\
        \ \n Number of passing instances for critical risk level \n 35 \n\n stats.critical.count_failing\
        \ \n Integer \n Number of failing instances for critical risk level \n 35 \n\n stats.high \n Object\
        \ \n Stats for high risk level \n See nested fields below \n\n stats.high.count_passing \n Integer\
        \ \n Number of passing instances for high risk level \n 30 \n\n stats.high.count_failing \n Integer\
        \ \n Number of failing instances for high risk level \n 30 \n\n stats.medium \n Object \n Stats\
        \ for medium risk level \n See nested fields below \n\n stats.medium.count_passing \n Integer\
        \ \n Number of passing instances for medium risk level \n 25 \n\n stats.medium.count_failing \n\
        \ Integer \n Number of failing instances for medium risk level \n 25 \n\n Error Responses\n\n\
        \ Status Code \n Description \n\n 400 \n The policy exists but is not a Posture policy, and therefore\
        \ does not have score components \n\n 404 \n \"Policy not found\" - The specified policy ID does\
        \ not exist \n\n 404 \n \"Policy has not been used in a score for a monitored service. Only scannable\
        \ posture policies are currently supported for scoring.\" - The policy exists but does not have\
        \ a score"
      parameters:
      - name: policy_id
        in: path
        required: true
        description: Path parameter policy_id
        schema:
          type: string
      responses:
        '200':
          description: Get policy stats
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              examples:
                Getpolicystats:
                  summary: Get policy stats
                  value:
                  - id: '93'
                    name: O365 - Prod
                    stats:
                      critical:
                        count_passing: 35
                        count_failing: 35
                      high:
                        count_passing: 30
                        count_failing: 30
                      medium:
                        count_passing: 25
                        count_failing: 25
                  - id: '94'
                    name: SFDCOrg 1f51478c-d96f-1324-a228-d78187f07dc4
                    stats:
                      critical:
                        count_passing: 30
                        count_failing: 30
                      high:
                        count_passing: 25
                        count_failing: 25
                      medium:
                        count_passing: 20
                        count_failing: 20
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
