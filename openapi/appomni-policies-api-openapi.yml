  /api/v1/core/policy/snapshot/:
    post:
      operationId: createAPosturePolicySnapshot
      summary: Create a Posture Policy Snapshot
      tags:
      - Policies
      description: 'STEPS:


        - GET - List Monitored Services [your_subdomain]/api/v1/core/monitoredservice/


        - GET - List monitored service policy settings - M365 only [your_subdomain]/api/v1/o365/svcexp/:serviceId/policy


        - POST - Create a Posture Policy Collections Snapshot [your_subdomain]/api/v1/core/policy/snapshot


        * `“name”` - The name you are giving the snapshot that is being created

        * `”baseline_monitored_service”` - maps to `”id”` from List Monitored Services - The monitored service that has the base policy content that is being snapshotted.

        * "target_monitored_services" - maps to `”id”` from List Monitored Services - The monitored services that the snapshot is saved to.

        * `”description”` - string - *optional

        * `“tags”` - maps to `“tags”` from List Monitored Services expressed as integers (environment or target tags) - *optional

        * `“policy_category”` - maps to `“policy_category”` from List monitored service policy settings -M365 only

        * `“policy_id”` - maps to `“policy_id”` from List monitored service policy settings


        PAYLOAD (BODY)


        {

        “type”: “policies”

        “collections”: [

        {

        “name”: “”,

        “description”: “”,

        “baseline_monitored_service_id”: “”,

        “target_monitored_service_ids”: “”,

        “policy_category”: “”,

        “policy_id”: “”,

        “tags”: “”,

        }

        ]

        }


        Request Parameters


        Field

        Data Type

        Required

        Description

        Example


        type

        String

        Yes

        Type

        policies


        collections

        Array[Object]

        Yes

        List of collections

        [{"name": "appomni", "description": "...


        collections[].name

        String

        Yes

        Name of the resource

        appomni


        collections[].description

        String (UUID)

        Yes

        Description of the resource

        74691f58-52a4-453e-9c22-b88c0e2cc851


        collections[].baseline_monitored_service

        Integer

        Yes

        Collections[] baseline monitored service

        17690


        collections[].target_monitored_services

        Array[Integer]

        Yes

        List of collections[].target monitored services

        [17690]


        collections[].policy_category

        String

        Yes

        Collections[] policy category

        m365exchangeaccepteddomain


        collections[].policy_id

        String (UUID)

        Yes

        ID of the collections[].policy

        4f07749c-6a46-492f-96fc-aa597238281b'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              type: policies
              collections:
              - name: appomni
                description: 74691f58-52a4-453e-9c22-b88c0e2cc851
                baseline_monitored_service: 17690
                target_monitored_services:
                - 17690
                policy_category: m365exchangeaccepteddomain
                policy_id: 4f07749c-6a46-492f-96fc-aa597238281b
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
