                $ref: '#/components/schemas/Error'
  /api/v1/findings/occurrence/restore/:
    patch:
      operationId: restoreAnOccurrence
      summary: Restore an occurrence
      tags:
      - Posture Findings
      description: 'Restore an occurrence that has been closed by exception.


        Utilize any parameters from the GET Finding Occurrences endpoint.


        To verify expected occurrences, you may want to execute a GET request on the /findings/occurrence/ endpoint with a query before attempting to restore any Occurrences.


        If the request is made with NO query parameters, EVERY Occurrence will be queued for having an exception added.


        Request Body


        Field

        Data Type

        Example

        Required


        ids

        List[str]


        Y


        Example Success Response:


        { "restored_count": 1 }


        Example Failure Responses:


        400 - Bad Request - {''non_field_error'': ''The occurrences of provided `filters` must exist in `Closed by Exception` status for them to be restored.''}


        500 - Internal Server Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              ids:
              - 0193651f-ae54-7e5f-8e60-befcbd2f497f
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/findings/occurrence/restore_by_filter/:
    patch:
      operationId: restoreOccurrencesByFilter
      summary: Restore occurrences by filter
      tags:
      - Posture Findings
      description: 'Restore an occurrence by filter for an occurrence that was closed by exception.


        To verify expected occurrences, you may want to execute a GET request on the /findings/occurrence/ endpoint with a query before attempting to restore any Occurrences.


        Note : Including finding_id__in as a query parameter is strongly recommended, otherwise your request will restore many unintended occurrences. If the request is made with NO query parameters, EVERY Occurrence will be queued for having an exception added.


        Request Body


        Field

        Data Type

        Example

        Required


        ids

        List[str]


        Y


        Example Success Response:


        { "restored_count": 1 }


        Example Failure Responses:


        200 - Returns 200 if auth is valid


        404 - Not Found (if any of the ids are invalid)


        500 - Internal Server Error'
      responses:
        '200':
          description: Restore Occurrences By Filter
          content:
            application/json:
              schema:
                type: object
              examples:
                RestoreOccurrencesByFilter:
                  summary: Restore Occurrences By Filter
                  value:
                    restored_count: 1
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/findings/finding/assign/:
    patch:
      operationId: assignFindings
      summary: Assign findings
      tags:
      - Posture Findings
      description: 'Assigns findings to users.


        id - Finding ID. Required in request payload.


        assignee_id - ID of the user. Required in request payload.


        If the assignee_id is null , then the finding is unassigned.'
      requestBody:
        required: true
        content:
