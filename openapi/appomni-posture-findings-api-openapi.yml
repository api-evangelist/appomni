  /api/v1/findings/occurrence/:
    get:
      operationId: getFindingOccurrences
      summary: Get finding occurrences
      tags:
      - Posture Findings
      description: 'Returns a list of all finding occurrences and can be filtered. Findings are comprised of policy rule violations and Insights.


        The API schema will be enhanced and made extensible with dynamic metadata based on finding type.


        This endpoint returns paginated results, even if not specifically specified on the request by having limit/offset params..


        The default limit/offset for all requests is 100 with an offset of 0. These parameters can still be specified on the request by the user. The maximum allowed value for limit is 100. If the value exceeds this, an error response of 400 is returned.


        As a best practice for efficiency, AppOmni recommends retrieving all occurrences for a given monitored service in a single call using this endpoint, rather than retrieving occurrences one-by-one, which could result in hitting rate limits.


        Response Fields


        Field

        Data Type

        Description

        Example


        context

        Object

        Dictionary containing context attributes that vary by insight and rule type

        {"user_id": "00u4eiqzlpM0YNfpb5d7", "group_id": "00g2uvbqiq89VNgJe5d7", "user_name": "Test User 358 Mocked"}


        detailed_status_label

        String

        String label for the detailed status

        "New"


        detailed_status_name

        String

        String name for the detailed status

        "new"


        finding_id

        String

        UUID string for the finding ID

        "0193472c-68ac-7365-ae7a-9a0e70b4442e"


        first_opened

        Datetime

        ISO 8601 string for when occurrence was first opened

        "2024-08-29T01:12:21.528946Z"


        id

        String

        UUID string for the occurrence ID

        "0193472c-6db5-72ce-b4ca-068181e76277"


        identity_hash

        String

        String hash for identity

        "70ed419bc83ba09d003323fa3484956ec7cb9362516b513fb58116c9ad0035cc"


        last_closed

        Datetime

        Optional ISO 8601 string for when occurrence was last closed

        "2024-08-29T01:12:21.528946Z"


        last_opened

        Datetime

        ISO 8601 string for when occurrence was last opened

        "2024-08-29T01:12:21.528946Z"


        monitored_service_id

        Integer

        Integer monitored service ID

        19681


        reasons

        Array[String]

        List of strings explaining why the occurrence exists

        ["User test358@example.com is assigned the Everyone Group."]


        status

        String

        String occurrence status

        "open"'
      responses:
