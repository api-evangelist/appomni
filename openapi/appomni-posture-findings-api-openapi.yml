  /api/v1/findings/occurrence/update_detailed_status/:
    patch:
      operationId: updateFindingOccurrenceDetailedStatusByOccurrenceIDs
      summary: Update finding occurrence detailed status by occurrence IDs
      tags:
      - Posture Findings
      description: 'Updates the status of a finding occurrence via occurrence_id. Findings are comprised of policy rule violations and Insights.


        - Only detailed statuses of new , in_research , in_remediation , done are allowed for the detailed_status properties values


        - The parent finding’s status must be open


        Request Body


        Field

        Data Type

        Example / Usage

        Description

        Required


        detailed_status

        str

        { detailed_status: ''remediated'' }

        A user defined status which can be applied to one or more occurrences


        Accepted options:


        new


        in_research


        in_remediation


        done

        y


        occurrence_ids

        List[str]

        { ids: [''bd055aec-60c7-42f3-920f-be72b8021227'']

        A list of one or more finding occurrence GUIDs to be updated


        Important Note: the entire request will fail if a single occurrence ID is invalid

        y


        Example Responses:


        Status Code: 204 No Content


        Status Code: 400 Bad Request

        {

        "ids": [

        "This field is required."

        ],

        "detailed_status": [

        "This field is required."

        ]

        }


        Status Code: 400 Bad Request

        "At least one occurrence is Closed. Ensure that you are only updating Open occurrences in this request."


        400 Bad Request

        "Invalid detailed status provided ''{invalid detailed status}''"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: "{\n  ids: ['bd055aec-60c7-42f3-920f-be72b8021227'],\n  detailed_status: 'remediated' \n}"
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
