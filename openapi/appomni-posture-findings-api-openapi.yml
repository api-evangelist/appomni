  /api/v1/findings/occurrence/close_by_exception/:
    patch:
      operationId: closeOccurrenceByException
      summary: Close occurrence by exception
      tags:
      - Posture Findings
      description: 'Close an occurrence by exception.


        Request Body


        Field

        Data Type

        Example / Usage

        Description

        Required


        Occurrence ID(s)

        List[str]

        { ids: [''bd055aec-60c7-42f3-920f-be72b8021227''] }

        A list of one or more finding occurrence GUIDs to be updated. Note: 1) The entire request will fail if a single occurrence ID is invalid.

        2) Occurrences provided must exist in the tenant and all must be in an "open" state to be valid.

        y


        Reason

        str

        { reason: ''risk_accepted'' }

        A value from the following list: risk_accepted; false_positive; compensating_controls; not_applicable; confirmed_intended

        y


        Expiration date

        str (ISO 8601) or undefined

        { expires: ''2025-01-21T15:30:00Z'' }

        A string representation of an ISO8601 date in the future when the exception will be automatically removed. If set to undefined , the exception never expires. This API accepts "null" for an exception that never expires.

        n


        Comment

        str

        { message: ''Some string explaining why'' }

        A plain text, user-entered comment allowing a user to add context to this action.

        n


        Example success response:


        {

        "closed_count": 1

        }


        Example failure responses:


        400 Bad Request { "ids": [ "This field is required." ], "expires": [ "This field is required." ] }


        400 Bad Request "At least one occurrence is Closed. Ensure that you are only creating an exception for Open occurrences in this request."


        400 Bad Request "{invalid reason} is not a valid choice."


        400 Bad Request "The occurrences of provided ids must exist in Open status for an Exception to be created."


        400 Bad Request "The occurrences of provided ids must exist in Open status for an Exception to be created."'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              ids:
              - 0193651f-ae54-7e5f-8e60-befcbd2f497f
              reason: risk_accepted
              expires: '2025-04-25T22:30:00Z'
              message: Some string explaining why
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
