- name: AO Developer Platform
  description: 'The AppOmni Developer Platform (AODP) enables the creation of custom service types allowing you to monitor the security posture of any application, including custom or proprietary apps that AppOmni does not natively support.


    Example use cases include:


    - Create a custom service type for applications that AppOmni does not natively support


    - Create a custom service type for custom or in-house app'
