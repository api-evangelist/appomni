  /api/v1/core/monitoredservice/:
    get:
      operationId: listMonitoredServices
      summary: List monitored services
      tags:
      - Monitored Services
      description: 'Returns a paginated list of all Monitored Services configured in your environment.


        Each entry includes core metadata such as name, service type, score, status flags, and connection state. Supports filtering and annotations via query parameters.


        Response Fields


        Field

        Data Type

        Description

        Example


        id

        Integer

        Unique identifier for the monitored service. This is an AppOmni internal ID

        5


        created

        String (ISO datetime)

        Timestamp when the service was created

        2022-11-29T05:56:26.372253Z


        created_by

        Integer

        ID of the user who created the service

        23


        modified

        String (ISO datetime)

        Timestamp of the last modification

        2022-11-29T05:56:26.372253Z


        modified_by

        Integer

        ID of the user that last modified the entry

        32


        owner

        Integer

        ID of the user or team that owns the service

        23


        name

        String

        Display name of the monitored service

        ''MS Name''


        external_id

        String

        Identifier from the external system

        ''1234-5683''


        service_id

        String

        Unique identifier of the connected service instance. This is the ID set by the connected service provider.

        ''1234''


        service_type

        String

        Type of service (e.g., box, github)

        ''box''


        service_type_slug

        String

        Slug version of the service type

        ''box''


        description

        String

        Optional human-readable description


        enforcement_mode

        String

        Policy enforcement mode (monitor, enforce, etc.)

        ''monitor''


        integration_connected

        Boolean

        Indicates if the service is currently connected

        false


        monitoring_reqs_satisfied

        Boolean

        Whether monitoring requirements are met

        true


        has_warnings

        Boolean

        True if the service has warnings

        false


        has_errors

        Boolean

        True if the service has errors

        false


        initial_ingest_complete

        Boolean

        True if initial data ingestion is complete

        true


        is_archived

        Boolean

        True if the service has been archived

        false


        tags

        Array[Integer]

        List of tag IDs assigned to the service

        [34, 55, 66]


        baseline_policies

        Array[Integer]

        IDs of applied baseline policies

        [1]


        detection_ingest_enabled

        Boolean

        True if detection ingest is enabled

        true


        score

        Integer

        Security score for the service (typically 0–100)

        100


        Annotations schema


        When the query parameter annotations=1 is included in the request, each Monitored Service object in the results array includes the following read-only, computed fields :


        Field

        Type

        Description

        Example


        open_issues_count

        Integer

        Number of unresolved issues associated with this service

        1


        last_run_insights

        String (ISO datetime)

        Timestamp of the last insights scan or analysis run

        2022-11-29T05:56:26.372253Z


        num_perspective_errors

        Integer

        Number of errors found across perspectives

        33


        any_perspective_errors

        Boolean

        Whether any perspective errors exist

        false


        service_installed_app_needs_update

        Boolean

        True if an installed app related to the service needs updating

        false


        total_users_count

        Integer

        Total number of users in the monitored service

        123


        inactive_user_count

        Integer

        Number of users marked as inactive

        222


        elevated_perm_user_count

        Integer

        Number of users with elevated permissions

        32


        admin_perm_user_count

        Integer

        Number of users with administrative permissions

        432'
