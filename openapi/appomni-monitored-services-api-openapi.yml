  /api/v1/{serviceType}/{serviceType}org/{id}/request_adhoc_sync/:
    post:
      operationId: requestSyncDataType
      summary: Request sync data type
      tags:
      - Monitored Services
      description: 'Request an on-demand resync of the provided data type.


        Affected by rate_limits and availability. Data syncs are enqueued. Only syncs with ‘allow_adhoc_refresh: true’ and ‘rate_limited: false’ will be requested.


        For the payload, specify the timestamp_field to resync.


        For developer platform module types, run:

        POST - api/v1/{serviceType}/{serviceType}org/{id}/request_adhoc_sync/.


        Response Fields


        Field

        Data Type

        Required

        Description

        Example


        sync_type

        String

        Yes

        Timestamp field to resync (use value from Data syncs)

        last_security_data_sync'
