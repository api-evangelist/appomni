  /api/v1/core/monitoredservice/{ms_id}/rotate_ingest_token/:
    patch:
      operationId: rotateIngestToken
      summary: Rotate ingest token
      tags:
      - Monitored Services
      description: 'Each sync event for a monitored service is a job that requires authentication to push data to AppOmni. An ingest token is the authentication that makes the sync secure. You might require the ingest token to make direct API calls when you''re using the AppOmni Developer Platform. Rotating a token immediately replaces the ingest token with a new value. Any existing integrations using the old/previous ingest token cease to work.


        Only users with Admin or Service Onboarder roles are able to use this endpoint. Users without permission will return a 403.


        Run the "List Monitored Services" endpoint to obtain the ms_id variable.


        There is no payload required for this endpoint.


        Response Fields


        Field

        Data Type

        Description

        Example


        token

        String (UUID)

        New ingest token value

        a5633c0d-a9dd-46c5-903d-5007dc6d6e42


        rotate_time

        String (ISO datetime)

        Time the token was rotated

        2024-07-17T18:41:02.452800+00:00


        url

        String

        Ingest API endpoint URL

        https://your-domain.appomni.com/platform/ingest/v2/ingest/'
      parameters:
      - name: ms_id
        in: path
        required: true
        description: Path parameter ms_id
        schema:
          type: string
      responses:
        '200':
          description: Rotate Ingest Token
          content:
            application/json:
              schema:
                type: object
              examples:
                RotateIngestToken:
                  summary: Rotate Ingest Token
                  value:
                    token: a5633c0d-a9dd-46c5-903d-5007dc6d6e42
                    rotate_time: '2024-07-17T18:41:02.452800+00:00'
                    url: https://[your-domain].appomni.com/platform/ingest/v2/ingest/
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
