  /api/v1/{serviceType}/{serviceType}org/{id}/sync_timestamps/:
    get:
      operationId: dataSyncs
      summary: Data syncs
      tags:
      - Monitored Services
      description: 'Provides users with information pertaining to the status of syncing various data types to AppOmni from their SaaS application.


        For example, if a sync hadn''t started or finished for a few days, AppOmni would be operating on data from whenever the last data sync completed successfully, and could be missing important configuration changes or repo additions that occurred during that interim period.


        For developer platform modules, run:

        GET api/v1/custom/custommonitoredservice/{id}/sync_timestamps/


        Response Fields


        Field

        Type

        Description

        Example


        timestamp_field

        String

        Internal field name for the last sync timestamp (used for lookups and logic)

        ''timestamp''


        label

        String

        i18n key or label describing the sync category

        ''label''


        allow_adhoc_refresh

        Boolean

        Whether ad-hoc manual sync is allowed for this type

        true


        description

        String

        i18n key or full description of the sync category

        ''description''


        rate_limited

        Boolean

        Whether triggering this sync is rate-limited

        true


        rate_limit_category

        String

        Indicates how heavily the sync is rate-limited (e.g., light, medium, heavy)

        ''light''


        last_sync_timestamp

        String (ISO datetime)

        Time the last sync finished (or was recorded as completed)

        2022-11-29T05:56:26.372253Z


        required_syncs

        Array[String]

        List of dependent sync steps that must be completed first

        []


        status

        String

        Current sync status (pending, failed, complete, etc.)

        ''complete''


        last_sync_start_time

        String (ISO datetime)

        Time the sync last began (useful for tracking duration)

        2022-11-29T05:56:26.372253Z


        long_sync_detected

        Boolean

        True if the system has flagged the sync as taking unusually long

        false


        messages

        String

        Optional additional info or warning messages

        ""'
