          description: List Findings
          content:
            application/json:
              schema:
                type: object
              examples:
                ListFindings:
                  summary: List Findings
                  value:
                    count: 1922
                    next: https://[your_subdomain].appomni.com/api/v1/findings/finding/?limit=25&offset=25&ordering=-first_opened
