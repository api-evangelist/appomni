  /api/v1/findings/occurrence/close_by_exception/:
    patch:
      operationId: closeOccurrenceByException
      summary: Close occurrence by exception
      tags:
      - Posture Findings
      description: "Close an occurrence by exception.\n\n Request Body\n\n Field \n Data Type \n Example\
        \ / Usage \n Description \n Required \n\n Occurrence ID(s) \n List[str] \n { ids: ['bd055aec-60c7-42f3-920f-be72b8021227']\
        \ } \n A list of one or more finding occurrence GUIDs to be updated. Note: 1) The entire request\
        \ will fail if a single occurrence ID is invalid. \n2) Occurrences provided must exist in the\
        \ tenant and all must be in an \"open\" state to be valid. \n y \n\n Reason \n str \n { reason:\
        \ 'risk_accepted' } \n A value from the following list: risk_accepted; false_positive; compensating_controls;\
        \ not_applicable; confirmed_intended \n y \n\n Expiration date \n str (ISO 8601) or undefined\
        \ \n { expires: '2025-01-21T15:30:00Z' } \n A string representation of an ISO8601 date in the\
        \ future when the exception will be automatically removed. If set to undefined , the exception\
        \ never expires. This API accepts \"null\" for an exception that never expires. \n n \n\n Comment\
        \ \n str \n { message: 'Some string explaining why' } \n A plain text, user-entered comment allowing\
        \ a user to add context to this action. \n n \n\n Example success response:\n\n {\n \"closed_count\"\
        : 1\n}\n\n Example failure responses:\n\n 400 Bad Request { \"ids\": [ \"This field is required.\"\
        \ ], \"expires\": [ \"This field is required.\" ] } \n\n 400 Bad Request \"At least one occurrence\
        \ is Closed. Ensure that you are only creating an exception for Open occurrences in this request.\"\
        \ \n\n 400 Bad Request \"{invalid reason} is not a valid choice.\" \n\n 400 Bad Request \"The\
        \ occurrences of provided ids must exist in Open status for an Exception to be created.\" \n\n\
        \ 400 Bad Request \"The occurrences of provided ids must exist in Open status for an Exception\
        \ to be created.\""
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              ids:
              - 0193651f-ae54-7e5f-8e60-befcbd2f497f
              reason: risk_accepted
              expires: '2025-04-25T22:30:00Z'
              message: Some string explaining why
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/findings/occurrence/close_by_exception_by_filter/:
    patch:
      operationId: closeOccurrenceByExceptionByFilter
      summary: Close occurrence by exception by filter
      tags:
      - Posture Findings
      description: "Close an occurrence by exception by filter.\n\n Pass in any filters to the URL as\
        \ query parameters to update all occurrences based on that filter set.\n\n Request Body\n\n Field\
        \ \n Data Type \n Example / Usage \n Description \n Required \n\n Reason \n str \n { reason: 'risk_accepted'\
        \ } \n A value from the following list: risk_accepted; false_positive; compensating_controls;\
        \ not_applicable; confirmed_intended \n y \n\n Expiration date \n str (ISO 8601) or undefined\
        \ \n { expires: '2025-01-21T15:30:00Z' } \n A string representation of an ISO8601 date in the\
        \ future when the exception will be automatically removed. If set to undefined , the exception\
        \ never expires. This API accepts \"null\" for an exception that never expires. \n n \n\n Comment\
        \ \n str \n { message: 'Some string explaining why' } \n A plain text, user-entered comment allowing\
        \ a user to add context to this action. \n n \n\n Example Success Response:\n\n 2Status Code:\
        \ 200 OK \n\n { \"closed_count\": 500 } \n\n Example Failure Responses:\n\n Status Code: 400 Bad\
        \ Request \n\n 400 Bad Request \n\n \"{invalid reason} is not a valid choice.\""
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              reason: risk_accepted
              expires: '2025-04-25T22:30:00Z'
              message: Some string explaining why
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/findings/occurrence/restore/:
    patch:
      operationId: restoreAnOccurrence
      summary: Restore an occurrence
      tags:
      - Posture Findings
      description: "Restore an occurrence that has been closed by exception.\n\n Utilize any parameters\
        \ from the GET Finding Occurrences endpoint.\n\n To verify expected occurrences, you may want\
        \ to execute a GET request on the /findings/occurrence/ endpoint with a query before attempting\
        \ to restore any Occurrences.\n\n If the request is made with NO query parameters, EVERY Occurrence\
        \ will be queued for having an exception added.\n\n Request Body\n\n Field \n Data Type \n Example\
        \ \n Required \n\n ids \n List[str] \n\n Y \n\n Example Success Response:\n\n { \"restored_count\"\
        : 1 } \n\n Example Failure Responses:\n\n 400 - Bad Request - {'non_field_error': 'The occurrences\
        \ of provided `filters` must exist in `Closed by Exception` status for them to be restored.'}\
        \ \n\n 500 - Internal Server Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              ids:
              - 0193651f-ae54-7e5f-8e60-befcbd2f497f
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/findings/occurrence/restore_by_filter/:
    patch:
      operationId: restoreOccurrencesByFilter
      summary: Restore occurrences by filter
      tags:
      - Posture Findings
      description: "Restore an occurrence by filter for an occurrence that was closed by exception.\n\n\
        \ To verify expected occurrences, you may want to execute a GET request on the /findings/occurrence/\
        \ endpoint with a query before attempting to restore any Occurrences.\n\n Note : Including finding_id__in\
        \ as a query parameter is strongly recommended, otherwise your request will restore many unintended\
        \ occurrences. If the request is made with NO query parameters, EVERY Occurrence will be queued\
        \ for having an exception added.\n\n Request Body\n\n Field \n Data Type \n Example \n Required\
        \ \n\n ids \n List[str] \n\n Y \n\n Example Success Response:\n\n { \"restored_count\": 1 } \n\
        \n Example Failure Responses:\n\n 200 - Returns 200 if auth is valid \n\n 404 - Not Found (if\
        \ any of the ids are invalid)\n\n 500 - Internal Server Error"
      responses:
        '200':
          description: Restore Occurrences By Filter
          content:
            application/json:
              schema:
                type: object
              examples:
                RestoreOccurrencesByFilter:
                  summary: Restore Occurrences By Filter
                  value:
                    restored_count: 1
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/findings/finding/assign/:
    patch:
      operationId: assignFindings
      summary: Assign findings
      tags:
      - Posture Findings
      description: "Assigns findings to users.\n\n id - Finding ID. Required in request payload.\n\n assignee_id\
        \ - ID of the user. Required in request payload.\n\n If the assignee_id is null , then the finding\
        \ is unassigned."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: "{\n    \"records\": [\n        {\n            \"id\": \"01951fab-7900-717f-b4f9-fb1d22d78c87\"\
              , // finding id\n            \"assignee_id\": 2 // user id\n        },\n        {\n    \
              \        \"id\": \"01951fab-793d-7431-905d-fefbb80af82b\",\n            \"assignee_id\"\
              : null // when null, the finding is unassigned\n        },\n    ]\n}"
      responses:
        '200':
          description: Assign Findings
          content:
            application/json:
              schema:
                type: object
              examples:
                AssignFindings:
                  summary: Assign Findings
                  value:
                    records:
                    - success: true
                      message: ''
                      id: 01951fab-7900-717f-b4f9-fb1d22d78c87
                    - success: true
                      message: ''
                      id: 01951fab-793d-7431-905d-fefbb80af82b
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/findings/finding/service_ids:
    get:
      operationId: listServiceIDs
      summary: List service IDs
      tags:
      - Posture Findings
      description: "Returns a list of monitored service service ids associated with your findings\n\n\
        \ Response Fields \n\n Field \n Data Type \n Description \n Example \n\n serivce_id \n String\
        \ \n ID of monitored service service ID \n \"foo-123\""
      responses:
        '200':
          description: List service IDs
          content:
            text/plain:
              schema:
                type: string
              example: "{\n    \"count\": 1,\n    \"next\": null,\n    \"previous\": null,\n    \"results\"\
                : [\n        {\n            \"service_id\": \"01f37ef3-e7ff-4134-b0c9-0a9439ec1d15foo-123\n\
                \    ]\n}"
        '401':
          description: Unauthorized — missing or invalid AppOmni API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — the token lacks permission for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'AppOmni API access token, created and managed in the AppOmni platform under Settings
        > API Settings. Sent as `Authorization: Bearer <token>`.'
  schemas:
    Error:
      type: object
      title: Error
      description: Standard Django REST Framework error envelope returned by the AppOmni API.
      properties:
        detail:
          type: string
          description: Human readable error message
