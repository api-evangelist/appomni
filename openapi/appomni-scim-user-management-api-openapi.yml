      parameters:
      - name: user_id
        in: path
        required: true
        description: Path parameter user_id
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              schemas:
              - urn:ietf:params:scim:schemas:core:2.0:User
              userName: '{{username}}'
              password: '{{password}}'
              name:
                givenName: '{{first_name}}'
                familyName: '{{last_name}}'
              externalId: '{{external_id}}'
              locale: en-US
              active: true
              emails:
              - value: '{{email}}'
                primary: true
