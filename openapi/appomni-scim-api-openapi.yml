        \ \n SCIM schema identifiers \n Array of schema URIs \n\n totalResults \n Integer \n Total number\
        \ of groups \n 13 \n\n itemsPerPage \n Integer \n Number of items per page \n 50 \n\n startIndex\
        \ \n Integer \n Starting index for pagination \n 1 \n\n Resources \n Array[Object] \n Array of\
        \ group objects \n Array of group objects \n\n Group Object Schema\n\n Field \n Data Type \n Description\
        \ \n Example \n\n id \n String \n Unique identifier for the group \n 315 \n\n externalId \n String\
        \ or null \n External identifier from SAML provider \n null \n\n schemas \n Array[String] \n SCIM\
        \ schema identifiers \n Array of schema URIs \n\n displayName \n String \n Display name of the\
        \ group \n Administrators \n\n members \n Array[Object] \n List of group members \n Array of member\
        \ objects \n\n meta \n Object \n Metadata about the resource \n Object with resourceType and location"
      responses:
