                        familyName: Doe
                        formatted: John Doe
                      displayName: John Doe
                      emails:
                      - value: user@example.com
                        primary: true
                      active: true
                      groups:
                      - value: '315'
                        $ref: https://example.appomni.com/scim/v2/Groups/315
                        display: Administrators
                      meta:
                        resourceType: User
                        created: '2021-07-06T15:17:44.031973+00:00'
                        lastModified: '2025-04-08T21:00:45.291578+00:00'
