naftiko: 1.0.0-alpha2
info:
  label: AppOmni SaaS Security API — Compliance
  description: 'AppOmni SaaS Security API — Compliance. 1 operations. Lead operation: AppOmni - List Compliance Reports. Self-contained
    Naftiko capability covering one Appomni business surface.'
  tags:
  - Appomni
  - Compliance
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APPOMNI_API_KEY: APPOMNI_API_KEY
capability:
  consumes:
  - type: http
    namespace: appomni-compliance
    baseUri: https://api.appomni.com/v1
    description: AppOmni SaaS Security API — Compliance business capability. Self-contained, no shared references.
    resources:
    - name: compliance-reports
      path: /compliance/reports
      operations:
      - name: listcompliancereports
        method: GET
        description: AppOmni - List Compliance Reports
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.APPOMNI_API_KEY}}'
  exposes:
  - type: rest
    namespace: appomni-compliance-rest
    port: 8080
    description: REST adapter for AppOmni SaaS Security API — Compliance. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/compliance/reports
      name: compliance-reports
      description: REST surface for compliance-reports.
      operations:
      - method: GET
        name: listcompliancereports
        description: AppOmni - List Compliance Reports
        call: appomni-compliance.listcompliancereports
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: appomni-compliance-mcp
    port: 9090
    transport: http
    description: MCP adapter for AppOmni SaaS Security API — Compliance. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: appomni-list-compliance-reports
      description: AppOmni - List Compliance Reports
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: appomni-compliance.listcompliancereports
      outputParameters:
      - type: object
        mapping: $.
